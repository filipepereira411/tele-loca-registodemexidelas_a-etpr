<!DOCTYPE html>
<html lang="pt">
<head>
    <meta http-equiv="X-UA-Compatible" content="IE=9">
    <meta charset="UTF-8">
    <title>Terminal de Escuta e Receção</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', monospace; }
        body { background: #050508; color: #00ff66; padding: 25px; font-size: 13px; line-height: 1.6; }
        .header { border-bottom: 1px solid #222230; padding-bottom: 10px; margin-bottom: 15px; color: #0078d4; font-family: sans-serif; }
        .log-line { margin-bottom: 5px; }
        .blink { animation: blinker 1.5s linear infinite; color: #ffaa00; }
        @keyframes blinker { 50% { opacity: 0; } }
    </style>
</head>
<body>

    <div class="header">
        <h2>Consola de Receção e Monitorização Operacional</h2>
        <p style="color: #8e8e93; font-size: 12px; margin-top: 4px;">Modo: Escuta contínua de IO (Sinalizador de Pastas)</p>
    </div>

    <div id="consola-logs">
        <div class="log-line">[SISTEMA] Motor de receção ativo.</div>
        <div class="log-line class='blink'">[ESCUTA] Aguardando sinal de redefinição de 'boom.html'...</div>
    </div>

    <script>
        // Inicia um loop de monitorização a cada 2 segundos
        var intervaloEscuta = setInterval(verificarSinalSincronizacao, 2000);

        function adicionarLog(texto, classe) {
            var consola = document.getElementById("consola-logs");
            var data = new Date().toLocaleTimeString();
            var div = document.createElement("div");
            div.className = "log-line" + (classe ? " " + classe : "");
            div.innerHTML = "[" + data + "] " + texto;
            consola.appendChild(div);
        }

        function verificarSinalSincronizacao() {
            try {
                var fso = new ActiveXObject("Scripting.FileSystemObject");
                var ficheiroSinal = "sinal_reset.tmp";
                
                // Se o ficheiro de sinal criado pelo boom.html existir, executa a limpeza
                if (fso.FileExists(ficheiroSinal)) {
                    adicionarLog("SINAL DETETADO! A iniciar purga completa da sessão...", "blink");
                    
                    // 1. Elimina o ficheiro de sinalização para interromper o ciclo
                    fso.DeleteFile(ficheiroSinal, true);
                    
                    // 2. Executa a limpeza dos logs técnicos acumulados da pasta
                    var ficheiroLog = "site_auditoria_log.txt";
                    if (fso.FileExists(ficheiroLog)) {
                        fso.DeleteFile(ficheiroLog, true);
                        adicionarLog("[LIMPEZA] Ficheiros de log em cache eliminados com sucesso.");
                    }
                    
                    adicionarLog("[SISTEMA] Estrutura de dados redefinida para o estado original.");
                    adicionarLog("[ESCUTA] Retornando ao estado de escuta estável...");
                }
            } catch (e) {
                // Silencia falhas temporárias de leitura/escrita simultânea
            }
        }
    </script>
</body>
</html>
